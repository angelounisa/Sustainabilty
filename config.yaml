# =====================================================================
# Analysis configuration - every parameter that affects results lives here.
# Units are stated explicitly for every quantity.
# =====================================================================

paths:
  raw: data/raw
  processed: data/processed
  figures: outputs/figures
  tables: outputs/tables
  landslides: data/landslides.csv

rain_gauges:            # file stem -> display name
  ALBORI_PLUVIOMETRO_CF_2025-2026: Albori
  CETARA_PLUVIOMETRO_CF_2025-2026: Cetara
  CETARA_SERBATOIO_COMUNALE_PLUVIOMETRO_CF_2025-2026: Cetara S.C.
  DRAGONEA_PLUVIOMETRO_CF_2025-2026: Dragonea
  SALERNO_GENIO_CIVILE_PLUVIOMETRO_CF_2025-2026: Salerno G.C.

rain:
  timestep_min: 10                 # gauge resolution (min); value at t = depth in (t-10min, t]
  time_zone: UTC+1                 # as stated in the CF files

soil:
  timestep_min: 5
  sites:
    V:                             # vegetated (forest cover), vertical z6-28525 (V2 in Ch.2)
      file: Salerno_METER_V_2025-2026
      depths_cm: [15, 35, 60]
    NV:                            # non-vegetated (open area), vertical z6-28531 (V1 in Ch.2)
      file: Salerno_METER_NV_2025-2026
      depths_cm: [15, 30, 60]
  # The logger clock jumps by +1 h on 2026-03-29 (no data lost, 1h05 step instead
  # of 5 min): interpreted as a switch to CEST. Timestamps after this instant are
  # shifted by -1 h to keep the whole series in UTC+1, like the rain gauges.
  dst_switch_local: "2026-03-29 06:10"
  vwc_valid_range: [0.0, 0.6]      # m3/m3, physical bounds (assertion)
  suction_valid_range: [0.0, 100000.0]  # kPa, TEROS 21 range (assertion)

events:
  ietd_h: 24                       # inter-event time definition T_s (h)
  min_cumulative_mm: 10            # events with E < 10 mm discarded
  imax_window_min: 60              # I_max = max 60-min moving sum (mm/h)
  max_windows_h: [1, 3, 6, 12, 24] # max moving-window totals inside the event (Patton et al. 2023)
  antecedent_days: [3, 7, 14, 30]  # antecedent rainfall before event start (mm)

hydro:
  antecedent_window_min: 60        # VWC0 / s0 = mean over the 60 min before t_start
  # response window = [t_start, t_end + response_extension_h]; by the IETD
  # definition no rain falls in the 24 h after t_end, so the extension captures
  # delayed peaks at depth without mixing events.
  response_extension_h: 24
  reference_gauge: Salerno G.C.    # gauge closest to the instrumented verticals (Ch.3)

clustering:
  relevance_ratio: 0.05            # relevant if dVWC >= 0.05 * VWC0
  z_extreme: 1.0                   # extreme if z(dVWC) >= 1 (z computed on relevant+extreme events)

infiltration:
  onset_fraction: 0.10             # wetting-front arrival = first time VWC >= VWC0 + 0.10*dVWC

stats:
  alpha: 0.05
  multiple_testing: holm           # correction across features within each gauge
  mahalanobis_features: [E_mm, Imax_mmh, NV_VWC0_60]
  mahalanobis_quantile: 0.95
  landslide_match_extension_h: 24  # landslide assigned to event if t_start <= t_ls <= t_end + 24 h
  kde_bw: scott

multivariate:
  # candidate variables; all oriented so that larger = more critical
  rain_vars: [E_mm, D_h, Imax_mmh, P3h_mm, P6h_mm, P24h_mm, A7d_mm, A30d_mm]
  water_vars: [NV_VWC0_15, NV_VWC0_30, NV_VWC0_60, V_VWC0_15, V_VWC0_35, V_VWC0_60,
               NV_dVWC_15, NV_dVWC_30, NV_dVWC_60, V_dVWC_15, V_dVWC_35, V_dVWC_60]
  chi2_quantile: 0.95

indicator:
  # fixed combinations tested per gauge (suction s0 enters with reversed sign: low = critical)
  fixed:
    "E": [E_mm]
    "P6h": [P6h_mm]
    "E + A7d": [E_mm, A7d_mm]
    "D + P6h": [D_h, P6h_mm]
    "E + NV VWC0 15": [E_mm, NV_VWC0_15]
    "P6h + NV VWC0 15": [P6h_mm, NV_VWC0_15]
    "E + NV VWC0 60": [E_mm, NV_VWC0_60]
    "E + V VWC0 60": [E_mm, V_VWC0_60]
    "E + NV s0 15": [E_mm, NV_s0_15]
    "D + P6h + NV VWC0 30": [D_h, P6h_mm, NV_VWC0_30]
    "E + A7d + NV VWC0 15": [E_mm, A7d_mm, NV_VWC0_15]
    "P6h + NV s0 15 + NV VWC0 60": [P6h_mm, NV_s0_15, NV_VWC0_60]
    "E + V dVWC 60 (event)": [E_mm, V_dVWC_60]
    "D + A7d + V dVWC 60 (event)": [D_h, A7d_mm, V_dVWC_60]
    # --- indicators with 4 or more variables
    "E + A7d + NV VWC0 15 + NV VWC0 60": [E_mm, A7d_mm, NV_VWC0_15, NV_VWC0_60]
    "E + P6h + A7d + NV VWC0 15": [E_mm, P6h_mm, A7d_mm, NV_VWC0_15]
    "E + Imax + NV VWC0 15 + NV s0 15": [E_mm, Imax_mmh, NV_VWC0_15, NV_s0_15]
    "D + P6h + A7d + NV VWC0 15 + NV VWC0 30": [D_h, P6h_mm, A7d_mm, NV_VWC0_15, NV_VWC0_30]
    "E + A7d + NV VWC0 profile (15/30/60)": [E_mm, A7d_mm, NV_VWC0_15, NV_VWC0_30, NV_VWC0_60]
    "E + A7d + NV VWC0 15 + V VWC0 35 + V VWC0 60 (both sites)": [E_mm, A7d_mm, NV_VWC0_15, V_VWC0_35, V_VWC0_60]
    "E + A7d + NV VWC0 15 + NV s0 15 + NV s0 30": [E_mm, A7d_mm, NV_VWC0_15, NV_s0_15, NV_s0_30]
    "All rain (8 var)": [E_mm, D_h, Imax_mmh, P3h_mm, P6h_mm, P24h_mm, A7d_mm, A30d_mm]
    "All rain + NV VWC0 profile (11 var)": [E_mm, D_h, Imax_mmh, P3h_mm, P6h_mm, P24h_mm, A7d_mm, A30d_mm, NV_VWC0_15, NV_VWC0_30, NV_VWC0_60]
    "All rain + all VWC0 + NV s0 (15 var)": [E_mm, D_h, Imax_mmh, P3h_mm, P6h_mm, P24h_mm, A7d_mm, A30d_mm, NV_VWC0_15, NV_VWC0_30, NV_VWC0_60, V_VWC0_35, V_VWC0_60, NV_s0_15, NV_s0_30]
    "E + A7d + NV VWC0 15 + V dVWC 60 (event)": [E_mm, A7d_mm, NV_VWC0_15, V_dVWC_60]
    "E + A7d + NV VWC0 15 + NV dVWC 30 + V dVWC 60 (event)": [E_mm, A7d_mm, NV_VWC0_15, NV_dVWC_30, V_dVWC_60]
  # nested selection inside each CV fold among these families
  select_rain: [E_mm, D_h, Imax_mmh, P3h_mm, P6h_mm, P24h_mm, A7d_mm, A30d_mm]
  select_water: [NV_VWC0_15, NV_VWC0_30, NV_VWC0_60, V_VWC0_35, V_VWC0_60]
